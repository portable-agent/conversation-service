spring:
    application:
        name: conversation-service
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${OIDC_ISSUER}

management:
    endpoints:
        web:
            exposure:
                include: health,prometheus

conversation:
    open-ttl: ${CONVERSATION_OPEN_TTL:PT24H}
    cleanup-delay: ${CONVERSATION_CLEANUP_DELAY:PT5M}
    cleanup-batch-size: ${CONVERSATION_CLEANUP_BATCH_SIZE:100}
