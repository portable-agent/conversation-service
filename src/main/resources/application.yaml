spring:
    application:
        name: conversation-service
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${OIDC_ISSUER}

management:
    endpoints:
        web:
            exposure:
                include: health,prometheus
